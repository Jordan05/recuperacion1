name: Docker CI

on:
  push:
    branches: [ "jordan" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/jordan05/jordan:1.0.5

      - name: Probar conexion SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "Conexion OK"
            hostname
            whoami

      - name: Pasar el jordan.yml al servidor
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "jordan.yml"
          target: "/home/${{ secrets.VPS_USER }}/despliegue"

      - name: Despliegue de los servicios
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "🟩 Desplegando servicios"
            cd ~/despliegue

            # Login manual al GHCR con tu PAT
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u jordan05 --password-stdin

            # Pull de la imagen
            docker pull ghcr.io/jordan05/jordan:1.0.5

            # Eliminar stack anterior
            docker stack rm jordan || true
            sleep 20

            # Desplegar stack
            docker stack deploy -c jordan.yml --with-registry-auth jordan

            docker ps


