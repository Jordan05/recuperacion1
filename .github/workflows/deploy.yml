name: Python application

on:
  push:
    branches: [ jordan ]

permissions:
  contents: read
  packages: write   # NECESARIO PARA SUBIR A GHCR

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      # Instalar dependencias (sin pytest)
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: 🔐 Login to GitHub Container Registry (GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/jordan05/jordan:1.0.5

      - name: Mostrar variables basicas
        run: |
          echo "Host: ${{ secrets.VPS_HOST }}"
          echo "Usuario: ${{ secrets.VPS_USER }}"
          echo "Puerto: ${{ secrets.VPS_SSH_PORT }}"

      - name: Probar conexion SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "Conexion OK"
            hostname
            whoami

      - name: Pasar el jordan.yml al servidor
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "jordan.yml"
          target: "/home/${{ secrets.VPS_USER }}/despliegue"

      - name: Despliegue de los servicios
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "🟩 Desplegando servicios"
            cd ~/despliegue

            # Login manual al GHCR con tu PAT
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u jordan05 --password-stdin

            # Pull de la imagen CORRECTA
            docker pull ghcr.io/jordan05/jordan:1.0.5

            # Eliminar stack anterior
            docker stack rm jordan || true
            sleep 30

            # Desplegar stack
            docker stack deploy -c jordan.yml --with-registry-auth jordan

            docker ps
